spring.application.name=game-zone
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}

spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Configuracion de Hibernate y JPA
# Define como Hibernate gestiona la creacion y actualizacion del esquema de la base de datos
# "none" no actualiza la base de datos de forma automatica y se deja la gestion manual en schema.sql y data.sql
spring.jpa.hibernate.ddl-auto=none

# Muestra las consultas SQL generadas en la consola
spring.jpa.show-sql=true

# Formatea las consultas SQL para que sean mas legibles en la consola
spring.jpa.properties.hibernate.format_sql=true

# Dialecto especifico de Hibernate para MariaDB (es compatible con MySQL)
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Inicializacion de la base de datos
# Esta propiedad asegura que Spring Boot ejecuta los archivos la estructura (schema.sql) y de carga de datos (data.sql) al inicio
spring.sql.init.mode=always

# Configuracion de los logs del datasource
# Muestra detalles adicionales sobre la conexion a la base de datos
logging.level.org.springframework.jdbc.datasource.DataSourceTransactionManager=DEBUG

# Numero maximo de conexiones que puede abrir el pool de conexiones
spring.datasource.hikari.maximum-pool-size=10

# Configuracion del tamano maximo para la subida de archivos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Ruta para guardar las imagenes, proveniente de una variable de entorno
upload.path=${UPLOAD_PATH}

# Clave secreta para generar el token
jwt.secret=${JWT_SECRET}

jwt.keystore.path=${JWT_KEYSTORE_PATH}
jwt.keystore.password=${JWT_KEYSTORE_PASSWORD}
jwt.keystore.alias=${JWT_KEYSTORE_ALIAS:jwt-keypair}