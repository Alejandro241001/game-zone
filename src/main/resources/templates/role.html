<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head ('Game Zone - Listado de Roles')"></head>
<body>

<header th:replace="fragments/header :: header"></header>

<main class="container mt-5">
  <h1 th:text="#{msg.role.title}"></h1>

  <div th:if="${errorMessage}" class="alert alert-danger">
    <p th:text="${errorMessage}"></p>
  </div>

  <table class="table table-bordered mt-3">
    <thead>
    <tr>
      <th th:text="#{msg.role.id}"></th>
      <th th:text="#{msg.role.name}"></th>
      <th th:text="#{msg.role.actions}"></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="role : ${listRole}">
      <td th:text="${role.id}"></td>
      <td th:text="${role.name}"></td>
      <td>
        <a th:href="@{/role/edit(id=${role.id})}" class="btn btn-primary btn-sm" th:text="#{msg.role.edit}"></a>
        <form th:action="@{/role/delete}" method="post" class="d-inline">
          <input type="hidden" name="id" th:value="${role.id}" />
          <button type="submit" class="btn btn-danger btn-sm"
                  th:onclick="return confirm('#{msg.role.confirm}');"
                  th:text="#{msg.role.delete}">
          </button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>

  <a th:href="@{/role/new}" class="btn btn-success mt-3" th:text="#{msg.role.add}"></a>
  <a href="#" th:href="@{/}" class="btn btn-secondary mt-3" th:text="#{msg.role.returnback}"></a>
</main>

<footer th:replace="fragments/footer :: footer"></footer>
</body>
</html>
