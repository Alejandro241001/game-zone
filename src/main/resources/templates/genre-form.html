<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head ('Game Zone - Formulario de Género')"></head>
<body>

<header th:replace="fragments/header :: header"></header>

<main class="container mt-5">
  <h1 th:text="#{msg.genre.add}"></h1>

  <div th:if="${errorMessage}" class="alert alert-danger">
    <p th:text="${errorMessage}"></p>
  </div>

  <form th:action="@{/genre/save}" th:object="${genre}" method="post">
    <div class="form-group">
      <label for="name" th:text="#{msg.genre.name}"></label>
      <input type="text" id="name" name="name" th:field="*{name}" class="form-control" placeholder="Nombre del Género" required />
    </div>

    <div class="form-group mt-3">
      <button type="submit" class="btn btn-primary" th:text="#{msg.genre.save}"></button>
      <a href="#" th:href="@{/genre}" class="btn btn-secondary ml-2" th:text="#{msg.genre.returnback}"></a>
    </div>
  </form>
</main>

<footer th:replace="fragments/footer :: footer"></footer>

</body>
</html>
