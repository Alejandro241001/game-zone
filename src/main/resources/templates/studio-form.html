<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head ('Game Zone - Formulario de Estudio')"></head>
<body>

<!-- Incluir el fragmento del header -->
<header th:replace="fragments/header :: header"></header>

<main class="container mt-5">
    <h1 th:text="#{msg.studio.add}"></h1>

    <!-- Muestra un mensaje de error si hay algún problema -->
    <div th:if="${errorMessage}" class="alert alert-danger">
        <p th:text="${errorMessage}"></p>
    </div>

    <form th:action="@{/studios/save}" th:object="${studio}" method="post">
        <div class="form-group">
            <label for="name" th:text="#{msg.studio.name}"></label>
            <input type="text" id="name" name="name" th:field="*{name}" class="form-control" placeholder="Nombre del Estudio" required />
        </div>

        <div class="form-group">
            <label for="country" th:text="#{msg.studio.country}"></label>
            <input type="text" id="country" name="country" th:field="*{country}" class="form-control" placeholder="País del Estudio" />
        </div>

        <div class="form-group mt-3">
            <button type="submit" class="btn btn-primary" th:text="#{msg.studio.save}"></button>
            <a href="#" th:href="@{/studios}" class="btn btn-secondary ml-2" th:text="#{msg.studio.returnback}"></a>
        </div>
    </form>
</main>

<!-- Incluir el fragmento del footer -->
<footer th:replace="fragments/footer :: footer"></footer>

</body>
</html>
