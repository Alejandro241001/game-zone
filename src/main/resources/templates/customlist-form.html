<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head ('Game Zone - Formulario de Lista Personalizada')"></head>
<body>

<header th:replace="fragments/header :: header"></header>

<main class="container mt-5">
  <h1>Nueva Lista Personalizada</h1>

  <div th:if="${errorMessage}" class="alert alert-danger">
    <p th:text="${errorMessage}"></p>
  </div>

  <form th:action="@{/customlists/save}" th:object="${customList}" method="post">
    <div class="form-group">
      <label for="name">Nombre de la lista</label>
      <input type="text" id="name" th:field="*{name}" class="form-control" required />
    </div>

    <div class="form-group">
      <label for="user">Usuario</label>
      <select id="user" th:field="*{userId}" class="form-control">
        <option th:each="user : ${users}"
                th:value="${user.id}"
                th:text="${user.username}">
        </option>
      </select>
    </div>

    <div class="form-group mt-3">
      <button type="submit" class="btn btn-primary">Guardar</button>
      <a th:href="@{/customlists}" class="btn btn-secondary ml-2">Volver</a>
    </div>
  </form>
</main>

<footer th:replace="fragments/footer :: footer"></footer>
</body>
</html>
