<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head ('Game Zone - Listado de Videojuegos')"></head>
<body>

<!-- Incluir el fragmento del header -->
<header th:replace="fragments/header :: header"></header>

<main class="container mt-5">
  <h1 th:text="#{msg.videogame.title}"></h1>

  <!-- Muestra un mensaje de error si hay algún problema -->
  <div th:if="${errorMessage}" class="alert alert-danger">
    <p th:text="${errorMessage}"></p>
  </div>

  <!-- Muestra la lista de videojuegos en una tabla -->
  <table class="table table-bordered mt-3">
    <thead>
    <tr>
      <th th:text="#{msg.videogame.id}"></th>
      <th th:text="#{msg.videogame.name}"></th>
      <th th:text="#{msg.videogame.studio}"></th>
      <th th:text="#{msg.videogame.actions}"></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="videogame : ${listVideoGames}">
      <td th:text="${videogame.id}"></td>
      <td th:text="${videogame.name}"></td>
      <td th:text="${videogame.studio.name}"></td>
      <td>
        <!-- Botón para editar -->
        <a th:href="@{/videogames/edit(id=${videogame.id})}" class="btn btn-primary btn-sm" th:text="#{msg.videogame.edit}"></a>
        <!-- Botón para eliminar -->
        <form th:action="@{/videogames/delete}" method="post" class="d-inline">
          <input type="hidden" name="id" th:value="${videogame.id}"/>
          <button type="submit" class="btn btn-danger btn-sm"
                  th:onclick="return confirm('#{msg.videogame.confirm}');"
                  th:text="#{msg.videogame.delete}">
          </button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>

  <!-- Botón para añadir un nuevo videojuego -->
  <a th:href="@{/videogames/new}" class="btn btn-success mt-3" th:text="#{msg.videogame.add}"></a>

  <!-- Volver a la página principal -->
  <a href="#" th:href="@{/}" class="btn btn-secondary mt-3" th:text="#{msg.videogame.returnback}"></a>
</main>

<!-- Incluir el fragmento del footer -->
<footer th:replace="fragments/footer :: footer"></footer>

</body>
</html>
