<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head ('Game Zone - #{msg.videogame.title.list}')"></head>
<body>

<header th:replace="fragments/header :: header"></header>

<main class="container mt-5">
  <h1 th:text="#{msg.videogame.title.list}"></h1>

  <div th:if="${errorMessage}" class="alert alert-danger">
    <p th:text="${errorMessage}"></p>
  </div>

  <table class="table table-bordered mt-3">
    <thead>
    <tr>
      <th th:text="#{msg.videogame.id}"></th>
      <th th:text="#{msg.videogame.title}"></th>
      <th th:text="#{msg.videogame.studio}"></th>
      <th th:text="#{msg.videogame.releaseDate}"></th>
      <th th:text="#{msg.videogame.actions}"></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="game : ${listVideogames}">
      <td th:text="${game.id}"></td>
      <td th:text="${game.title}"></td>
      <td th:text="${game.studio != null ? game.studio.name : 'N/A'}"></td>
      <td th:text="${#temporals.format(game.releaseDate, 'dd/MM/yyyy')}"></td>
      <td>
        <a th:href="@{/videogame/edit(id=${game.id})}" class="btn btn-primary btn-sm" th:text="#{msg.videogame.edit}"></a>
        <form th:action="@{/videogame/delete}" method="post" class="d-inline">
          <input type="hidden" name="id" th:value="${game.id}" />
          <button type="submit" class="btn btn-danger btn-sm"
                  th:onclick="return confirm('#{msg.videogame.confirm}');"
                  th:text="#{msg.videogame.delete}">
          </button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>

  <a th:href="@{/videogame/new}" class="btn btn-success mt-3" th:text="#{msg.videogame.add}"></a>
  <a th:href="@{/}" class="btn btn-secondary mt-3" th:text="#{msg.videogame.returnback}"></a>
</main>

<footer th:replace="fragments/footer :: footer"></footer>
</body>
</html>
